<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F6; color: #101418; font-family: 'Barlow', sans-serif">
  <div style="flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; line-height: 1.02; font-weight: 700">Let's find today's workout</h1>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">How much time do you have?</h2>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{times}}" as="o" hint-placeholder-count="5">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 52px; padding: 0; border: 1px solid #101418; border-radius: 8px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">How do you feel?</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{feels}}" as="o" hint-placeholder-count="5">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 48px; padding: 0 18px; border: 1px solid #101418; border-radius: 8px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">What are you doing?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{kinds}}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 48px; padding: 0; border: 1px solid #101418; border-radius: 8px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="padding: 12px 16px; border-radius: 8px; background: #FFFFFF">
      <p style="margin: 0; font-size: 15px; font-weight: 700">Last night</p>
      <p style="margin: 2px 0 0; font-size: 15px; line-height: 1.35">6 h 40 min sleep, resting heart rate 58. Synced 2 hours ago.</p>
    </div>
    <sc-if value="{{unwell}}" hint-placeholder-val="{{ false }}">
      <p style="margin-top: auto; margin-bottom: 0; padding: 16px; border-radius: 8px; background: #FFF0E0; font-size: 16px; line-height: 1.35">Rest is the right call today. Haanf won't suggest a workout while you're unwell.</p>
    </sc-if>
    <sc-if value="{{canAsk}}" hint-placeholder-val="{{ true }}">
      <a href="CoachPlan.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; flex-shrink: 0; height: 56px; border-radius: 8px; background: #1F5BFF; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Find my workout</a>
    </sc-if>
  </div>
  <nav aria-label="Main" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 72px; background: #FFFFFF; border-top: 1px solid #DDE2E6">
    <a href="ProgramHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #56616B; font-size: 13px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Program</a>
    <a href="CoachCheckIn.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1F5BFF; font-size: 13px; font-weight: 700; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Coach</a>
    <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #56616B; font-size: 13px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  options(key, labels, fallback) {
    const picked = (this.state && this.state[key]) || fallback;
    return labels.map((label) => ({
      label,
      on: picked === label ? 'true' : 'false',
      bg: picked === label ? '#101418' : '#FFFFFF',
      fg: picked === label ? '#FFFFFF' : '#101418',
      pick: () => this.setState({ [key]: label }),
    }));
  }
  renderVals() {
    const feel = (this.state && this.state.feel) || 'OK';
    return {
      times: this.options('time', ['20', '30', '45', '60', 'Other'], '30'),
      feels: this.options('feel', ['Great', 'OK', 'Tired', 'Sore', 'Unwell'], 'OK'),
      kinds: this.options('kind', ['Run', 'Cycle', 'Treadmill'], 'Run'),
      unwell: feel === 'Unwell',
      canAsk: feel !== 'Unwell',
    };
  }
}
</script>
</body>
</html>
