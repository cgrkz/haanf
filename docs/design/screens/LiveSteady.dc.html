<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live workout, steady step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; background: #1F5BFF; color: #FFFFFF; font-family: 'Barlow', sans-serif">
  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 40px; line-height: 1; font-weight: 700">Warm-up</h1>
    <p style="margin: 0; font-size: 16px; font-weight: 600">Step 1 of 9</p>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center">
    <p style="margin: 0; display: flex; align-items: baseline; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 200px; line-height: 0.95; font-weight: 700">118<span style="font-size: 32px; font-weight: 600">bpm</span></p>
    <p style="margin: 8px 0 0; font-size: 22px; font-weight: 700">In your easy zone. Stay under 133.</p>
  </div>
  <div role="img" aria-label="Current zone: Easy" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 24px">
    <div>
      <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.4)"></div>
      <p style="margin: 4px 0 0; font-size: 14px">Recovery</p>
    </div>
    <div>
      <div style="height: 14px; margin-top: -3px; border-radius: 4px; background: #FFFFFF"></div>
      <p style="margin: 1px 0 0; font-size: 14px; font-weight: 700">Easy</p>
    </div>
    <div>
      <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.4)"></div>
      <p style="margin: 4px 0 0; font-size: 14px">Hard</p>
    </div>
    <div>
      <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.4)"></div>
      <p style="margin: 4px 0 0; font-size: 14px">Very hard</p>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px">
    <div>
      <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 52px; line-height: 1; font-weight: 700">6:42</p>
      <p style="margin: 2px 0 0; font-size: 15px">left in this step</p>
    </div>
    <div>
      <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 52px; line-height: 1; font-weight: 700">0.6</p>
      <p style="margin: 2px 0 0; font-size: 15px">km so far</p>
    </div>
  </div>
  <a href="LiveInterval.dc.html" style="display: block; margin-bottom: 16px; font-size: 17px; font-weight: 600">Then 2:00 hard</a>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <a href="TalkTest.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 8px; background: #FFFFFF; color: #101418; font-size: 18px; font-weight: 700; text-decoration: none">Talk test</a>
    <a href="Summary.dc.html" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; height: 60px; border: 2px solid #FFFFFF; border-radius: 8px; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">Finish</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
