<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Haanf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 32px 24px; display: flex; flex-direction: column; background: #1F5BFF; color: #FFFFFF; font-family: 'Barlow', sans-serif">
  <h1 style="margin: 48px 0 0; font-family: 'Barlow Condensed', sans-serif; font-size: 112px; line-height: 1; font-weight: 700">Haanf</h1>
  <div aria-hidden="true" style="flex-grow: 1; display: flex; align-items: center; gap: 6px">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="31">
      <div style="width: 5px; height: {{b.h}}px; background: #FFFFFF; border-radius: 3px"></div>
    </sc-for>
  </div>
  <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; line-height: 1.05; font-weight: 600">Build endurance you can feel.</p>
  <p style="margin: 16px 0 32px; font-size: 18px; line-height: 1.4">Follow a research-backed program, or let the AI coach choose today's workout.</p>
  <a href="AboutYou.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 8px; background: #FFFFFF; color: #101418; font-size: 18px; font-weight: 700; text-decoration: none">Get started</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [];
    for (let i = 0; i < 31; i++) {
      const breath = Math.abs(Math.sin(i * 0.42));
      const fade = 1 - i / 42;
      bars.push({ h: Math.round(10 + 170 * breath * fade) });
    }
    return { bars };
  }
}
</script>
</body>
</html>
