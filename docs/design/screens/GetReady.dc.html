<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Get ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 16px; background: #F3F5F6; color: #101418; font-family: 'Barlow', sans-serif">
  <a href="ProgramHome.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#101418" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div>
    <p style="margin: 0; font-size: 14px; font-weight: 600; color: #56616B">Foundation 8, Week 5</p>
    <h1 style="margin: 4px 0 2px; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; line-height: 1.02; font-weight: 700">4 x 2 min hard</h1>
    <p style="margin: 0; font-size: 16px; color: #56616B">About 32 min</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{kinds}}" as="o" hint-placeholder-count="3">
      <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 48px; padding: 0; border: 1px solid #101418; border-radius: 8px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{o.label}}</button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-radius: 8px; background: #FFFFFF">
    <div>
      <p style="margin: 0; font-size: 17px; font-weight: 700">Pixel Watch 2</p>
      <p style="margin: 2px 0 0; font-size: 15px; color: #56616B">Heart rate connected</p>
    </div>
    <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 48px; line-height: 1; font-weight: 700">78 <span style="font-size: 20px; font-weight: 600">bpm</span></p>
  </div>
  <div style="display: flex; flex-direction: column; border-radius: 8px; background: #FFFFFF">
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
      <button type="button" onClick="{{t.flip}}" aria-pressed="{{t.on}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; padding: 14px 20px; border: 0; background: transparent; color: #101418; font: inherit; text-align: left; cursor: pointer">
        <span>
          <span style="display: block; font-size: 17px; font-weight: 700">{{t.label}}</span>
          <span style="display: block; margin-top: 2px; font-size: 15px; line-height: 1.3; color: #56616B">{{t.hint}}</span>
        </span>
        <span aria-hidden="true" style="flex-shrink: 0; display: flex; justify-content: {{t.align}}; box-sizing: border-box; width: 52px; height: 32px; padding: 3px; border-radius: 16px; background: {{t.track}}">
          <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span>
        </span>
      </button>
    </sc-for>
  </div>
  <a href="LiveSteady.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; flex-shrink: 0; height: 64px; border-radius: 8px; background: #1F5BFF; color: #FFFFFF; font-size: 20px; font-weight: 700; text-decoration: none">Start workout</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const picked = s.kind || 'Outdoor run';
    const kinds = ['Outdoor run', 'Cycling', 'Treadmill'].map((label) => ({
      label,
      on: picked === label ? 'true' : 'false',
      bg: picked === label ? '#101418' : '#FFFFFF',
      fg: picked === label ? '#FFFFFF' : '#101418',
      pick: () => this.setState({ kind: label }),
    }));
    const talk = !!s.talk;
    const cues = s.cues !== false;
    const toggle = (key, label, hint, value) => ({
      label,
      hint,
      on: value ? 'true' : 'false',
      align: value ? 'flex-end' : 'flex-start',
      track: value ? '#1F5BFF' : '#737F8A',
      flip: () => this.setState({ [key]: !value }),
    });
    return {
      kinds,
      toggles: [
        toggle('talk', 'Talk test', 'Count out loud during easy steps, never during hard efforts.', talk),
        toggle('cues', 'Spoken cues', 'Hear each step with your phone in a pocket.', cues),
      ],
    };
  }
}
</script>
</body>
</html>
