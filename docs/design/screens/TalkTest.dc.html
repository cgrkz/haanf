<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talk test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; background: #101418; color: #FFFFFF; font-family: 'Barlow', sans-serif">
  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <p style="margin: 0; font-size: 17px; font-weight: 700">Talk test</p>
    <p style="margin: 0; font-size: 17px; font-weight: 600">126 bpm</p>
  </div>
  <h1 style="margin: 32px 0 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 56px; line-height: 1.02; font-weight: 700">Keep moving. Count out loud.</h1>
  <p style="margin: 0; font-size: 18px; line-height: 1.35">Start at 1 and keep your normal pace until you hear the tone.</p>
  <div aria-hidden="true" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 5px">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="26">
      <div style="width: 6px; height: {{b.h}}px; border-radius: 3px; background: #FFFFFF"></div>
    </sc-for>
  </div>
  <p style="margin: 0 0 24px; font-family: 'Barlow Condensed', sans-serif; font-size: 48px; line-height: 1; font-weight: 700; text-align: center">0:09</p>
  <h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 700">How was that?</h2>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <a href="LiveSteady.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 8px; background: #FFFFFF; color: #101418; font-size: 18px; font-weight: 700; text-decoration: none">Comfortable</a>
    <a href="LiveSteady.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 8px; background: #FFFFFF; color: #101418; font-size: 18px; font-weight: 700; text-decoration: none">Short bursts</a>
    <a href="LiveSteady.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 8px; background: #FFFFFF; color: #101418; font-size: 18px; font-weight: 700; text-decoration: none">Couldn't talk</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const heights = [14, 30, 62, 92, 70, 40, 18, 12, 36, 84, 112, 90, 48, 16, 12, 28, 68, 100, 76, 42, 20, 12, 34, 72, 52, 22];
    return { bars: heights.map((h) => ({ h })) };
  }
}
</script>
</body>
</html>
